<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 350px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: border-color 0.3s;
        }

        .upload-area.dragover {
            border-color: #007cba;
            background-color: #f0f8ff;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: #007cba;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .upload-btn:hover {
            background: #005a8b;
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .file-info {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            margin-top: 10px;
        }

        .success {
            color: #28a745;
        }

        .error {
            color: #dc3545;
        }

        .status {
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .process-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .process-btn:hover {
            background: #218838;
        }

        .process-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>Excel Upload & Click</h3>

        <div class="upload-area" id="uploadArea">
            <p>📁 Arraste um arquivo Excel aqui ou clique para selecionar</p>
            <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls">
            <button class="upload-btn" id="uploadBtn">Selecionar Arquivo</button>
        </div>

        <div id="fileInfo" class="file-info" style="display: none;">
            <strong>Arquivo selecionado:</strong><br>
            <span id="fileName"></span><br>
            <span id="fileSize"></span>
        </div>

        <div id="status" style="display: none;"></div>

        <button class="process-btn" id="processBtn" disabled>
            Processar & Clicar no Botão
        </button>
    </div>

    <script src="popup.js"></script>
</body>

</html>
